<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Publicação — Turkista CMS</title>
<style>
:root{--r:#F279C8;--r2:#C94E9C;--g:#0C1014;--c:#6B6B6B;--b:#E4E4E4;--f:#FAFAFA;--ok:#1C6B3B;--w:#8A5A00;--e:#A3312A}
*{box-sizing:border-box}body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--f);color:var(--g);margin:0;padding:28px 16px 70px}.c{max-width:900px;margin:auto}header{display:flex;justify-content:space-between;gap:20px;margin-bottom:24px}h1{font-size:25px;margin:0 0 5px}header p{margin:0;color:var(--c);font-size:14px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}nav a{color:var(--r2);text-decoration:none;border:1px solid var(--b);background:#fff;padding:8px 12px;border-radius:8px;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:20px}.card h2{font-size:15px;margin:0 0 14px}.valor{font-size:25px;font-weight:700}.muted{color:var(--c);font-size:12px;margin-top:5px}.status{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}.dot{width:9px;height:9px;border-radius:50%;background:var(--c)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--w)}pre{white-space:pre-wrap;word-break:break-word;background:#11151a;color:#eee;border-radius:8px;padding:13px;font-size:12px;min-height:50px;max-height:260px;overflow:auto}label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}input{width:100%;padding:11px;border:1px solid var(--b);border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:11px 15px;font:600 13px inherit;cursor:pointer;background:var(--r2);color:white}button.sec{background:white;color:var(--g);border:1px solid var(--b)}button:disabled{opacity:.5;cursor:wait}.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.msg{margin-top:14px;padding:11px 13px;border-radius:8px;display:none;font-size:13px}.msg.ok{display:block;background:#E9F9EE;color:var(--ok)}.msg.err{display:block;background:#FDECEC;color:var(--e)}@media(max-width:700px){.grid{grid-template-columns:1fr}header{display:block}}
</style></head>
<body><div class="c">
<header><div><h1>Publicação</h1><p>Controle local das alterações do Turkista antes de enviar ao GitHub.</p></div><div class="status" id="sg"><span class="dot"></span><span>Carregando…</span></div></header>
<nav><a href="/">Produtos</a><a href="/artigos.html">Artigos</a><a href="/fotos.html">Fotos</a></nav>
<div class="grid"><section class="card"><h2>Estado do Git</h2><div class="valor" id="branch">—</div><div class="muted" id="up">—</div><div class="muted" id="cnt">—</div></section>
<section class="card"><h2>Alterações</h2><div class="valor" id="qtd">0</div><div class="muted">arquivos modificados no projeto</div><div class="acoes"><button class="sec" onclick="carregar()">Atualizar</button><button class="sec" onclick="diff()">Ver alterações</button></div></section></div>
<section class="card" style="margin-top:14px"><h2>Resumo das alterações</h2><pre id="out">Nenhum diff carregado.</pre></section>
<section class="card" style="margin-top:14px"><h2>Criar commit</h2><label for="msg">Mensagem</label><input id="msg" value="cms: atualizar conteúdo do site"><div class="acoes"><button id="bc" onclick="commit()">Criar commit local</button></div><div id="ret" class="msg"></div></section>
</div>
<script>
async function api(u,o){const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw Error(d.detalhes||d.erro||"Erro");return d}
function ret(t,ok){const e=document.getElementById("ret");e.textContent=t;e.className="msg "+(ok?"ok":"err")}
async function carregar(){try{const d=await api("/api/git/status");document.getElementById("branch").textContent=d.branch||"sem branch";document.getElementById("up").textContent=d.upstream?"Origem: "+d.upstream:"Sem upstream configurado";document.getElementById("cnt").textContent=d.aFrente+" à frente · "+d.atras+" atrás";document.getElementById("qtd").textContent=d.arquivosAlterados.length;document.getElementById("sg").innerHTML='<span class="dot '+(d.alterado?"warn":"ok")+'"></span><span>'+(d.alterado?"Alterações pendentes":"Tudo limpo")+'</span>'}catch(e){ret(e.message,false)}}
async function diff(){try{const d=await api("/api/git/diff");document.getElementById("out").textContent=[d.resumo,d.unstaged,d.staged].filter(Boolean).join("\\n\\n")||"Nenhuma alteração."}catch(e){ret(e.message,false)}}
async function commit(){const b=document.getElementById("bc");b.disabled=true;try{const d=await api("/api/git/commit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mensagem:document.getElementById("msg").value})});ret(d.mensagem+(d.commit?" · "+d.commit:""),true);await diff();await carregar()}catch(e){ret(e.message,false)}finally{b.disabled=false}}
carregar();
</script></body></html>
